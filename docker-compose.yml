# ============================================================
# 智诊通 · 本地依赖服务
#
# **省赛不需要这个文件。** 前端 + Spring Boot 默认全用 H2 内存库，
# 评委 clone 下来直接 `mvn spring-boot:run` 就能跑。
#
# 这个文件是给国赛准备的：切到 MySQL，以及给 RAG 上 pgvector。
#
# 用法：
#   docker compose up -d mysql          # 只起 MySQL（切换 Spring Boot 数据源用）
#   docker compose up -d                # 全部起来（含 pgvector，RAG 阶段）
#   docker compose down                 # 停掉
#   docker compose down -v              # 停掉并删除数据卷（数据全没了）
#
# 起来之后切后端数据源：
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# ============================================================

services:
  # ---------------- MySQL 8 ----------------
  # 后端业务库：患者档案、就诊记录、预约单、提醒任务
  mysql:
    image: mysql:8.4
    container_name: zhidao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-zhidao}
      MYSQL_USER: ${MYSQL_USER:-zhidao}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zhidao}
      # 中文必须 utf8mb4：utf8（3 字节）存不下 emoji 与部分生僻字，
      # 而病历里出现生僻字姓名是常态
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 后端要在 MySQL 真正可连接之后再启动，否则第一次会连接失败
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------- PostgreSQL + pgvector ----------------
  # 给 RAG 用：知识库向量 + 语义缓存（docs/09 §5）
  # 省赛阶段知识库是内存里的 10 条 BM25，不需要它
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: zhidao-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-zhidao}
      POSTGRES_USER: ${PGVECTOR_USER:-zhidao}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-zhidao}
      TZ: Asia/Shanghai
    ports:
      - "${PGVECTOR_PORT:-5432}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-zhidao} -d ${PGVECTOR_DB:-zhidao}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
    name: zhidao-mysql-data
  pgvector-data:
    name: zhidao-pgvector-data
