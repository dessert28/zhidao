server:
  port: 8080

spring:
  application:
    name: zhidao-backend

  # ---------------- 数据源 ----------------
  # 省赛用 H2 内存库：评委 clone 下来 mvn spring-boot:run 就能跑，不用装 MySQL。
  # 国赛切 MySQL 只需改 spring.profiles.active=mysql（见 application-mysql.yml）
  #
  # ⚠️ 内存库的后果必须知道：**进程一停，数据就没了**，
  #    下次启动重新执行 data.sql 灌种子数据。
  #    演示中途重启后端，之前创建的预约/病历会消失 ——
  #    这不是 bug，是 in-memory 的定义。
  #
  # 需要跨重启保留数据时，用文件库（不影响"clone 就能跑"，只是多一个开关）：
  #   1. 先 export APP_SEED_MODE=never，否则每次启动都会再灌一遍种子
  #   2. 再 export H2_URL=jdbc:h2:file:./data/zhidao;MODE=MySQL;DATABASE_TO_LOWER=TRUE
  #   或者直接：mvn spring-boot:run -Dspring-boot.run.arguments="--H2_URL=..."
  #
  # 为什么默认仍是内存库：评委不会为了看演示去部署持久化存储，
  # 而"启动即可用、每次都是干净数据"恰好符合验收场景。
  datasource:
    url: ${H2_URL:jdbc:h2:mem:zhidao;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  sql:
    init:
      # 文件库模式下不该重复灌种子（会产生重复行），用 APP_SEED_MODE=never 关掉。
      # 注意不能把 data-locations 设成 "never" —— 那会被当资源路径，
      # 变成"找不到 classpath:never"而启动失败。所以关种子靠 mode。
      mode: ${APP_SEED_MODE:always}
      # 拆成两个文件：主表结构 + HIS 接入相关表。
      # 拆开是为了让"HIS 对接"这块能整块拿出/拿下，
      # 不影响主表的可读性。顺序有意义：主表先建。
      schema-locations: classpath:schema.sql,classpath:schema-his.sql
      data-locations: classpath:data.sql

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，生产关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除统一字段名 deleted（docs/09 三条硬约束之二）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------- 智诊通自有配置 ----------------
zhidao:
  jwt:
    # 演示用固定密钥；生产从环境变量注入
    secret: ${ZHIDAO_JWT_SECRET:zhidao-demo-secret-key-change-in-production-0123456789}
    expire-minutes: 120
  # 提醒引擎：扫表间隔与提前提醒窗口
  reminder:
    scan-cron: "0 */5 * * * *"
    advance-hours: 24
    lookback-hours: 48
  # 院区适配：省赛两个 Mock，用 -1 / -2 区分（负数表示 Mock，绝不可能是真实院区）
  hospital:
    mock:
      enabled: true

# ---------------- 接口文档 ----------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.zhidao: debug
    # 关掉 Security 的默认噪音
    org.springframework.security: warn
