server:
  port: 8080

spring:
  application:
    name: zhidao-backend

  # ---------------- 数据源 ----------------
  # 省赛用 H2 内存库：评委 clone 下来 mvn spring-boot:run 就能跑，不用装 MySQL。
  # 国赛切 MySQL 只需改 spring.profiles.active=mysql（见 application-mysql.yml）
  #
  # ⚠️ 内存库的后果必须知道：**进程一停，数据就没了**，
  #    下次启动重新执行 data.sql 灌种子数据。
  #    演示中途重启后端，之前创建的预约/病历会消失 ——
  #    这不是 bug，是 in-memory 的定义。
  #
  # 需要跨重启保留数据时，用文件库（不影响"clone 就能跑"，只是多一个开关）：
  #   1. 先 export APP_SEED_MODE=never，否则每次启动都会再灌一遍种子
  #   2. 再 export H2_URL=jdbc:h2:file:./data/zhidao;MODE=MySQL;DATABASE_TO_LOWER=TRUE
  #   或者直接：mvn spring-boot:run -Dspring-boot.run.arguments="--H2_URL=..."
  #
  # 为什么默认仍是内存库：评委不会为了看演示去部署持久化存储，
  # 而"启动即可用、每次都是干净数据"恰好符合验收场景。
  datasource:
    url: ${H2_URL:jdbc:h2:mem:zhidao;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  sql:
    init:
      # 文件库模式下不该重复灌种子（会产生重复行），用 APP_SEED_MODE=never 关掉。
      # 注意不能把 data-locations 设成 "never" —— 那会被当资源路径，
      # 变成"找不到 classpath:never"而启动失败。所以关种子靠 mode。
      mode: ${APP_SEED_MODE:always}
      # 拆成多个文件：主表结构 + HIS 接入相关表 + 院方调阅 + 问诊对话留痕。
      # 拆开是为了让"HIS 对接"、"院方调阅"、"对话留痕"这几块能整块拿出/拿下，
      # 不影响主表的可读性。顺序有意义：主表先建。
      # schema-chat.sql 放最后：它只依赖 schema.sql 里的约定（deleted 列、逻辑删除），
      # 与 HIS / 调阅两块没有任何关系，放在末尾也不影响它们。
      schema-locations: classpath:schema.sql,classpath:schema-his.sql,classpath:schema-access.sql,classpath:schema-chat.sql,classpath:schema-visit.sql
      data-locations: classpath:data.sql

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，生产关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除统一字段名 deleted（docs/09 三条硬约束之二）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------- 智诊通自有配置 ----------------
zhidao:
  jwt:
    # 演示用固定密钥；生产从环境变量注入
    secret: ${ZHIDAO_JWT_SECRET:zhidao-demo-secret-key-change-in-production-0123456789}
    expire-minutes: 120
  # 提醒引擎：扫表间隔与提前提醒窗口
  reminder:
    scan-cron: "0 */5 * * * *"
    advance-hours: 24
    lookback-hours: 48
  # 院区适配：省赛两个 Mock，用 -1 / -2 区分（负数表示 Mock，绝不可能是真实院区）
  hospital:
    mock:
      enabled: true
  # ---------------- AI 接入层（大作业分支新增） ----------------
  # 课设考核点名 Spring AI Alibaba。这里只做"最小模型调用验证"，
  # 主编排（五 Agent / RAG / SSE）仍在 frontend 的 Node BFF，不在这里重写。
  ai:
    # 总开关：默认开，但没 Key 时端点会返回"未配置"状态而不是报错 ——
    # 保证评委 clone 下来不填任何东西也能完整启动，与前端"无 Key 也能跑"同构。
    enabled: ${ZHIDAO_AI_ENABLED:true}
  ai-verify:
    # Key 只从环境变量读，默认值故意留空：绝不写进 yml、不进日志、不进 git。
    # 填了 Key，/api/ai/verify 才会真的调一次模型；没填就返回明确的状态提示。
    api-key: ${ZHIDAO_LLM_API_KEY:}
    # 走 OpenAI 兼容协议，与 frontend/.env 的 LLM_BASE_URL / LLM_MODEL 对应。
    # 默认 DeepSeek，换成 Qwen / Moonshot / Ollama 只改环境变量。
    base-url: ${ZHIDAO_LLM_BASE_URL:https://api.deepseek.com/v1}
    model: ${ZHIDAO_LLM_MODEL:deepseek-chat}

# ---------------- 接口文档 ----------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.zhidao: debug
    # 关掉 Security 的默认噪音
    org.springframework.security: warn
  pattern:
    # %X{requestId} 由 common/RequestIdFilter 写入 MDC，请求结束后清除。
    # 放在方括号里：没有 requestId 时（如启动日志、@Scheduled 线程）
    # 会渲染成字面量 ""，一行里仍能看出"这条不是某个请求产生的"，
    # 比留空更好辨认。
    #
    # 折叠在这样一行里的好处：用户报错时截图/复制一行就够定位，
    # 不用再去翻"这个 traceId 是哪个请求的"。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [rid=%X{requestId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [rid=%X{requestId:-}] %logger{36} - %msg%n"

# ---------------- Actuator 健康探针 ----------------
# 只暴露 health / info / metrics 三个。
# **不要用 include: "*"**：env、heapdump、threaddump 这类端点会吐出
# 环境变量与内存快照，在医疗系统里等同于泄露基础设施信息。
#
# show-details: when-authorized —— 匿名只能看到 up/down，
# 数据库、磁盘等组件的细节要登录后才给。
# 这正好配合 SecurityConfig 里 /actuator/** 的 permitAll：
# 探针（K8s livenessProbe / 负载均衡）拿不到 JWT 也必须能问"活着没"，
# 而"活着没"本来就不是秘密。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
