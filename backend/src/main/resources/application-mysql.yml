# ------------------------------------------------------------------
# MySQL 配置（国赛切换用）
#
# 用法：
#   docker compose up -d mysql
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#
# 为什么单独一个 profile 而不是改 application.yml 的默认值：
#   省赛的核心承诺是「评委 clone 下来 mvn spring-boot:run 就能跑，不用装 MySQL」
#   （README §9）。把默认数据源换成 MySQL 会直接毁掉这条承诺。
#   所以 H2 保持默认，MySQL 是显式选择的另一条路。
# ------------------------------------------------------------------

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:zhidao}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:zhidao}
    password: ${MYSQL_PASSWORD:zhidao}
    hikari:
      # 连接池：单实例演示够用；真实部署要按并发调
      maximum-pool-size: 10
      minimum-idle: 2

  sql:
    init:
      # ⚠️ 这一行决定"重启会不会清库"，动之前先读完这段。
      #
      # schema-mysql.sql 开头是 DROP TABLE IF EXISTS（它不是增量迁移脚本），
      # 而 mode=always 会在**每次启动**执行它 —— 也就是说：
      #   · 演示期：每次启动都是干净数据，这是想要的效果
      #   · 上线后：每次重启把真库清空重建，等于数据全丢
      #
      # 所以这里用 SEED_MODE 开关而不是写死，并给出两种明确用法：
      #
      #   演示（默认）：什么都不设 —— 启动即干净数据
      #   上线：先手工执行一次 schema-mysql.sql + data.sql 建库灌种子，
      #         然后 export APP_SEED_MODE=never，此后重启不再动表结构
      #
      # 上线后请配合 --spring.profiles.active=mysql,prod 一起用（见 application-prod.yml），
      # 那个 profile 会把 init 彻底关掉。
      mode: ${APP_SEED_MODE:always}
      schema-locations: classpath:schema-mysql.sql
      data-locations: classpath:data.sql

  # MySQL 下不需要 H2 控制台
  h2:
    console:
      enabled: false

mybatis-plus:
  configuration:
    # 生产别打印 SQL（H2 profile 里开着方便调试）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    # MySQL profile 下把业务日志降到 info，避免刷屏
    com.zhidao: info
